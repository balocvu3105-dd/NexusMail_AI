services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexusmail_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nexusmail
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: nexusmail_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus
    container_name: nexusmail_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=512MB'
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 40M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana
    container_name: nexusmail_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:8.0
    container_name: nexusmail_aspire_dashboard
    restart: unless-stopped
    ports:
      - "18888:18888" # Dashboard UI
      - "4317:4317"   # OTLP gRPC
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/NexusMail.API/NexusMail.API.csproj
        DLL_NAME: NexusMail.API.dll
    container_name: nexusmail_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__Database=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - OpenTelemetry__Endpoint=http://aspire-dashboard:4317
      - FeatureFlags__AiEnabled=true
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - JwtSettings__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      - GoogleOAuth__ClientId=${GOOGLE_OAUTH_CLIENT_ID}
      - GoogleOAuth__ClientSecret=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GoogleOAuth__RedirectUri=${GOOGLE_OAUTH_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker-ai:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/NexusMail.Worker.AI/NexusMail.Worker.AI.csproj
        DLL_NAME: NexusMail.Worker.AI.dll
    container_name: nexusmail_worker_ai
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__Database=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - OpenTelemetry__Endpoint=http://aspire-dashboard:4317
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - JwtSettings__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      - AI__OpenAI__ApiKey=${OPENAI_API_KEY}
      - AI__DefaultProvider=${AI_DEFAULT_PROVIDER}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 80M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  worker-automation:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/NexusMail.Worker.Automation/NexusMail.Worker.Automation.csproj
        DLL_NAME: NexusMail.Worker.Automation.dll
    container_name: nexusmail_worker_automation
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__Database=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - OpenTelemetry__Endpoint=http://aspire-dashboard:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-emailsync:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/NexusMail.Worker.EmailSync/NexusMail.Worker.EmailSync.csproj
        DLL_NAME: NexusMail.Worker.EmailSync.dll
    container_name: nexusmail_worker_emailsync
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__Database=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - OpenTelemetry__Endpoint=http://aspire-dashboard:4317
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpirationMinutes=${JWT_EXPIRATION_MINUTES}
      - JwtSettings__RefreshTokenExpirationDays=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS}
      - GoogleOAuth__ClientId=${GOOGLE_OAUTH_CLIENT_ID}
      - GoogleOAuth__ClientSecret=${GOOGLE_OAUTH_CLIENT_SECRET}
      - GoogleOAuth__RedirectUri=${GOOGLE_OAUTH_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 80M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  worker-search:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: src/NexusMail.Worker.Search/NexusMail.Worker.Search.csproj
        DLL_NAME: NexusMail.Worker.Search.dll
    container_name: nexusmail_worker_search
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__Database=Host=postgres;Database=nexusmail;Username=postgres;Password=password
      - ConnectionStrings__RabbitMq=amqp://guest:guest@rabbitmq:5672
      - OpenTelemetry__Endpoint=http://aspire-dashboard:4317
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
